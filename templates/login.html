<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập — MNT AutoPost</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
             background:var(--bg-primary,#0f172a);font-family:system-ui,Segoe UI,sans-serif}
        .login-card{width:340px;max-width:90vw;background:var(--bg-card,#1e293b);
             border:1px solid var(--border,#334155);border-radius:14px;padding:32px 28px;
             box-shadow:0 12px 40px rgba(0,0,0,.4)}
        .login-logo{width:56px;height:56px;border-radius:14px;background:#111a2b;
             border:3px solid #34d399;display:flex;align-items:center;justify-content:center;
             font-weight:800;color:#34d399;font-size:20px;margin:0 auto 16px}
        .login-title{text-align:center;color:var(--text-primary,#f1f5f9);font-size:18px;
             font-weight:700;margin-bottom:4px}
        .login-sub{text-align:center;color:var(--text-muted,#64748b);font-size:12px;margin-bottom:22px}
        .login-card input{width:100%;box-sizing:border-box;padding:11px 13px;border-radius:8px;
             border:1px solid var(--border,#334155);background:var(--bg-input,#0f172a);
             color:var(--text-primary,#f1f5f9);font-size:14px;margin-bottom:14px}
        .login-card input:focus{outline:none;border-color:#34d399}
        .login-btn{width:100%;padding:11px;border:none;border-radius:8px;background:#34d399;
             color:#04231a;font-weight:700;font-size:14px;cursor:pointer}
        .login-btn:hover{filter:brightness(1.05)}
        .login-err{background:rgba(239,68,68,.12);border:1px solid #ef4444;color:#fca5a5;
             font-size:12px;padding:9px 11px;border-radius:8px;margin-bottom:14px;text-align:center}
    </style>
</head>
<body>
    <form class="login-card" method="POST" action="/login">
        <div class="login-logo">TN</div>
        <div class="login-title">MNT AutoPost</div>
        <div class="login-sub">Nhập mật khẩu để truy cập từ xa</div>
        {% if error %}<div class="login-err">{{ error }}</div>{% endif %}
        <input type="password" name="password" placeholder="Mật khẩu" autofocus autocomplete="current-password">
        <button class="login-btn" type="submit">Đăng nhập</button>
    </form>
</body>
</html>
